services:
  backend:
    build:
      context: ./backend
    container_name: yume-brain
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - db_data:/app/data
      - chroma_data:/app/chroma_db
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: yume-ui
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  db_data:
  chroma_data:
